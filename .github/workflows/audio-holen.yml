name: Audio holen
on:
  push:
    paths: ['tools/holen.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dateien laden
        run: python3 tools/holen.py
      - name: Speichern
        run: |
          git config user.name "audio-bot"
          git config user.email "audio-bot@users.noreply.github.com"
          git add -A audio img tools/holen-log.txt
          git diff --cached --quiet || git commit -m "Audio aktualisiert"
          git push
